name: Feature request
description: Describe a use case or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem and your current workaround, if any.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include alternatives you have considered.
    validations:
      required: true
