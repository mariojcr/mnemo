# Every push and pull request runs the full suite (ClickHouse included). From main, the image goes
# to ghcr.io as `main` and `sha-<7>`. A version tag on main (`v0.2.0`, or a pre-release such as
# `v0.2.0-rc.1`) also pushes the image as `0.2.0` (and `latest` unless it is a pre-release) and
# publishes a GitHub Release with the static client and its signed manifest, which `mnemo update`
# installs.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Builds made before this repository existed are numbered below 100. Numbers here continue above
  # them, so `mnemo update` never takes a build from this repository for an older one.
  SEQ_BASE: 100

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history: the tag check needs main, the build number counts its commits
          fetch-depth: 0
          persist-credentials: false
      # The same grammar `mnemo update` accepts, and only commits that are on main: the build number
      # is only meaningful there.
      - name: Release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "::error::not a release tag: $tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag is not on main"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ $tag == *-* ]]; then pre=true; else pre=false; fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: Format, lint and test
        run: make test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image comes from the Dockerfile's `runtime` stage, the same one anyone vendoring mnemo
      # builds, and is checked before it is pushed: if it does not start here, it is not published.
      - name: Build
        run: |
          set -euo pipefail
          commit=${GITHUB_SHA::7}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build --pull --target runtime --build-arg "MNEMO_COMMIT=$commit" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:sha-$commit" .
          docker run --rm "$image:sha-$commit" version | grep -qF "($commit)"
      - name: Push
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          sha=sha-${GITHUB_SHA::7}
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("$sha")
          # main only from main, and a version only from its checked tag
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(main); fi
          if [ -n "$VERSION" ]; then
            tags+=("$VERSION")
            if [ "$PRERELEASE" = false ]; then tags+=(latest); fi
          fi
          for t in "${tags[@]}"; do
            docker tag "$image:$sha" "$image:$t"
            docker push -q "$image:$t"
          done

  # The static client (musl) from the Dockerfile's release stage, as `make release` builds it. Built
  # and checked here with no secret; it is signed in another job.
  binary:
    needs: test
    if: needs.test.outputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          commit=${GITHUB_SHA::7}
          seq=$((SEQ_BASE + $(git rev-list --first-parent --count "$GITHUB_SHA")))
          rm -rf dist
          make release "COMMIT=$commit" "SEQ=$seq"
          cd dist
          sha256sum -c checksums.txt
          ./mnemo-linux-x86_64 version | grep -qF "($commit)"
          # what gets signed: the sum and which build it is (commit, ref, number), so that another
          # signed build cannot be served in its place
          { echo "commit $GITHUB_SHA"; echo "ref $GITHUB_REF"; echo "seq $seq"; cat checksums.txt; } > release.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/mnemo-linux-x86_64
            dist/checksums.txt
            dist/release.txt
          if-no-files-found: error
          retention-days: 1

  # The Ed25519 signature of release.txt with the key in the RELEASE_SIGNING_KEY secret, on a fresh
  # runner where nothing that was built runs: neither a build.rs nor a test can reach the key. It
  # signs only a manifest of this commit and tag, with a key that `deploy/release-key.pub` lists,
  # and checks the signature before publishing. The secret belongs to the `release` environment,
  # which only `v*` tags may use: a workflow pushed on any other branch cannot read it.
  release:
    needs: [test, binary]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: rel
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd rel
          grep -qx "commit $GITHUB_SHA" release.txt || { echo "::error::the manifest is not of $GITHUB_SHA"; exit 1; }
          grep -qx "ref $GITHUB_REF" release.txt || { echo "::error::the manifest is not of $GITHUB_REF"; exit 1; }
          grep ' mnemo-linux-x86_64$' release.txt | sha256sum -c
          # the key on stdin, never in a file; openssl by absolute path
          printf '%s\n' "$SIGNING_KEY" | /usr/bin/openssl pkey -in /dev/stdin -pubout > signer.pub
          grep -qxF "$(sed -n 2p signer.pub)" ../deploy/release-key.pub \
            || { echo "::error::the signing key is not in deploy/release-key.pub"; exit 1; }
          printf '%s\n' "$SIGNING_KEY" | /usr/bin/openssl pkeyutl -sign -inkey /dev/stdin -rawin -in release.txt -out release.sig.raw
          /usr/bin/openssl pkeyutl -verify -pubin -inkey signer.pub -rawin -in release.txt -sigfile release.sig.raw
          base64 -w0 release.sig.raw > release.txt.sig
          rm release.sig.raw signer.pub
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.test.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          files=(rel/mnemo-linux-x86_64 rel/checksums.txt rel/release.txt rel/release.txt.sig)
          # a re-run replaces the files of the release it already made
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=(--verify-tag --title "$tag" --generate-notes)
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
